name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  common:
    uses: HR0101/gh-ci-bootstrap/.github/workflows/common-ci.yml@v1
    # リポごとに挙動を変えたい場合はコメントを外して調整できます:
    # with:
    #   enable-no-emoji: true
    #   strict-emoji: false
    #   enable-apple: true
    #   max-file-size-mb: 10
    #   always-run-builds: false

  # このリポ固有のジョブを追加したい場合は以下に続けて書けます:
  # custom-job:
  #   needs: common
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v6
  #     - run: echo "custom step"
