name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN をリポジトリの読み取りだけに絞る（最小権限）
permissions:
  contents: read

# PR の連続 push 時のみ古い実行をキャンセルし，main/master は実行ごとに別グループで全履歴を残す
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 全ての run ステップで bash (-eo pipefail) を有効化
defaults:
  run:
    shell: bash

# セキュリティ強化（任意）:
# サードパーティ Action はコミット SHA で固定し，Dependabot（github-actions）で定期更新する運用を推奨します．

jobs:
  repo-checks:
    name: 共通チェック & スタック検出
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      node_pm: ${{ steps.detect.outputs.node_pm }}
      node_has_pm_field: ${{ steps.detect.outputs.node_has_pm_field }}
      node_yarn_berry: ${{ steps.detect.outputs.node_yarn_berry }}
      node_has_lockfile: ${{ steps.detect.outputs.node_has_lockfile }}
      node_version_file: ${{ steps.detect.outputs.node_version_file }}
      has_python: ${{ steps.detect.outputs.has_python }}
      python_installer: ${{ steps.detect.outputs.python_installer }}
      python_version: ${{ steps.detect.outputs.python_version }}
      python_version_file: ${{ steps.detect.outputs.python_version_file }}
      has_python_deps: ${{ steps.detect.outputs.has_python_deps }}
      python_has_build_system: ${{ steps.detect.outputs.python_has_build_system }}
      python_has_pyproject_deps: ${{ steps.detect.outputs.python_has_pyproject_deps }}
      python_has_dev_extra: ${{ steps.detect.outputs.python_has_dev_extra }}
      python_has_dev_group: ${{ steps.detect.outputs.python_has_dev_group }}
      has_python_tests: ${{ steps.detect.outputs.has_python_tests }}
      has_apple: ${{ steps.detect.outputs.has_apple }}
      apple_kind: ${{ steps.detect.outputs.apple_kind }}
      apple_workspace: ${{ steps.detect.outputs.apple_workspace }}
      apple_project: ${{ steps.detect.outputs.apple_project }}
      apple_has_podfile: ${{ steps.detect.outputs.apple_has_podfile }}
      apple_has_swiftlint: ${{ steps.detect.outputs.apple_has_swiftlint }}
      has_dart_flutter: ${{ steps.detect.outputs.has_dart_flutter }}
      dart_kind: ${{ steps.detect.outputs.dart_kind }}
      has_dart_tests: ${{ steps.detect.outputs.has_dart_tests }}
      has_dotnet: ${{ steps.detect.outputs.has_dotnet }}
      dotnet_target: ${{ steps.detect.outputs.dotnet_target }}
      dotnet_global_json: ${{ steps.detect.outputs.dotnet_global_json }}
      dotnet_versions: ${{ steps.detect.outputs.dotnet_versions }}
      has_dotnet_tests: ${{ steps.detect.outputs.has_dotnet_tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect project stack
        id: detect
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import re
          import subprocess

          try:
            import tomllib
          except ImportError:
            tomllib = None


          def gitTrackedFiles():
            try:
              res = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True)
            except (subprocess.CalledProcessError, FileNotFoundError):
              return []
            return [p for p in os.fsdecode(res.stdout).split("\0") if p]


          def detectNode():
            hasNode = os.path.isfile("package.json")
            pm = "npm"
            hasPmField = False
            yarnBerry = False
            hasLockfile = False
            versionFile = ""

            if hasNode:
              try:
                with open("package.json", "r", encoding="utf-8-sig") as f:
                  pkg = json.load(f)
                pmSpec = str(pkg.get("packageManager", "")).strip()
                if pmSpec:
                  hasPmField = True
                  if pmSpec.startswith("pnpm@"):
                    pm = "pnpm"
                  elif pmSpec.startswith("yarn@"):
                    pm = "yarn"
                    yarnVer = pmSpec.split("@", 1)[1]
                    if not yarnVer.startswith("1."):
                      yarnBerry = True
                  elif pmSpec.startswith("bun@"):
                    pm = "bun"
                  elif pmSpec.startswith("npm@"):
                    pm = "npm"
              except (OSError, json.JSONDecodeError):
                pass

              if not hasPmField:
                if os.path.isfile("pnpm-lock.yaml"):
                  pm = "pnpm"
                elif os.path.isfile("yarn.lock") or os.path.isfile(".yarnrc.yml"):
                  pm = "yarn"
                elif os.path.isfile("bun.lock") or os.path.isfile("bun.lockb"):
                  pm = "bun"
                else:
                  pm = "npm"

              # packageManager 未記載でも .yarnrc.yml があれば Yarn Berry と判定する
              if pm == "yarn" and not yarnBerry and os.path.isfile(".yarnrc.yml"):
                yarnBerry = True

              lockCandidates = {
                "pnpm": ["pnpm-lock.yaml"],
                "yarn": ["yarn.lock"],
                "bun": ["bun.lock", "bun.lockb"],
                "npm": ["package-lock.json", "npm-shrinkwrap.json"],
              }
              hasLockfile = any(os.path.isfile(p) for p in lockCandidates.get(pm, []))

              for vf in (".nvmrc", ".node-version"):
                if os.path.isfile(vf):
                  versionFile = vf
                  break

            return {
              "has_node": "true" if hasNode else "false",
              "node_pm": pm,
              "node_has_pm_field": "true" if hasPmField else "false",
              "node_yarn_berry": "true" if yarnBerry else "false",
              "node_has_lockfile": "true" if hasLockfile else "false",
              "node_version_file": versionFile,
            }


          def resolvePythonVersion(requiresSpec):
            """requires-python の下限を読み，3.12 を既定にしつつ >=3.13 等にも対応する．"""
            defaultVer = (3, 12)
            if not requiresSpec:
              return "3.12"
            # >=3.13 / ~=3.13 / ==3.13.* / >3.12 等の下限を抽出
            minRequired = None
            for op, maj, mn in re.findall(r"(>=|==|~=|>)(\d+)\.(\d+)", str(requiresSpec)):
              pair = (int(maj), int(mn))
              if op == ">":
                pair = (pair[0], pair[1] + 1)
              if minRequired is None or pair > minRequired:
                minRequired = pair
            if minRequired and minRequired > defaultVer:
              return f"{minRequired[0]}.{minRequired[1]}"
            return "3.12"


          def detectPython(trackedFiles):
            depFiles = ("pyproject.toml", "requirements.txt", "requirements-dev.txt", "setup.py", "uv.lock")
            hasPyDeps = any(os.path.isfile(f) for f in depFiles)
            pyFiles = [p for p in trackedFiles if p.endswith(".py") and os.path.isfile(p)]
            hasPython = hasPyDeps or len(pyFiles) > 0

            installer = "uv" if os.path.isfile("uv.lock") else "pip"
            versionFile = ".python-version" if os.path.isfile(".python-version") else ""
            pythonVersion = "3.12"

            # setup.cfg 単体はツール設定のみのことも多く pip install -e . で落ちるため対象外
            hasBuildSystem = os.path.isfile("setup.py")
            hasPyprojectDeps = False
            hasDevExtra = False
            hasDevGroup = False

            if os.path.isfile("pyproject.toml") and tomllib is not None:
              try:
                with open("pyproject.toml", "rb") as f:
                  data = tomllib.load(f)
                project = data.get("project") if isinstance(data.get("project"), dict) else {}
                if "build-system" in data:
                  hasBuildSystem = True
                if isinstance(project.get("dependencies"), list) and len(project["dependencies"]) > 0:
                  hasPyprojectDeps = True
                optDeps = project.get("optional-dependencies")
                if isinstance(optDeps, dict) and "dev" in optDeps:
                  hasDevExtra = True
                depGroups = data.get("dependency-groups")
                if isinstance(depGroups, dict) and "dev" in depGroups:
                  hasDevGroup = True
                if not versionFile and project.get("requires-python"):
                  pythonVersion = resolvePythonVersion(project.get("requires-python"))
              except (OSError, tomllib.TOMLDecodeError):
                pass

            hasTests = False
            for p in pyFiles:
              parts = p.split("/")
              base = os.path.basename(p)
              if "tests" in parts or base.startswith("test_") or base.endswith("_test.py"):
                hasTests = True
                break

            return {
              "has_python": "true" if hasPython else "false",
              "python_installer": installer,
              "python_version": "" if versionFile else pythonVersion,
              "python_version_file": versionFile,
              "has_python_deps": "true" if hasPyDeps else "false",
              "python_has_build_system": "true" if hasBuildSystem else "false",
              "python_has_pyproject_deps": "true" if hasPyprojectDeps else "false",
              "python_has_dev_extra": "true" if hasDevExtra else "false",
              "python_has_dev_group": "true" if hasDevGroup else "false",
              "has_python_tests": "true" if hasTests else "false",
            }


          def isXcodeGenSpec(path):
            if not os.path.isfile(path):
              return False
            try:
              text = open(path, "r", encoding="utf-8", errors="replace").read()
            except OSError:
              return False
            return bool(re.search(r"^\s*targets\s*:", text, re.M))


          def detectApple():
            entries = sorted(os.listdir("."))
            # ルート直下のみを見ることで *.xcodeproj/project.xcworkspace の誤検出を防ぐ
            workspaces = [e for e in entries if e.endswith(".xcworkspace") and os.path.isdir(e)]
            projects = [e for e in entries if e.endswith(".xcodeproj") and os.path.isdir(e)]
            hasPodfile = os.path.isfile("Podfile")
            hasXcodegen = isXcodeGenSpec("project.yml")
            hasSpm = os.path.isfile("Package.swift")
            hasSwiftLint = os.path.isfile(".swiftlint.yml") or os.path.isfile(".swiftlint.yaml")

            appleKind = ""
            appleWorkspace = workspaces[0] if workspaces else ""
            appleProject = projects[0] if projects else ""

            if appleWorkspace:
              appleKind = "xcworkspace"
            elif appleProject:
              appleKind = "xcodeproj"
            elif hasXcodegen:
              appleKind = "xcodegen"
            elif hasSpm:
              appleKind = "spm"

            return {
              "has_apple": "true" if appleKind else "false",
              "apple_kind": appleKind,
              "apple_workspace": appleWorkspace,
              "apple_project": appleProject,
              "apple_has_podfile": "true" if hasPodfile else "false",
              "apple_has_swiftlint": "true" if hasSwiftLint else "false",
            }


          def detectDartFlutter(trackedFiles):
            if not os.path.isfile("pubspec.yaml"):
              return {
                "has_dart_flutter": "false",
                "dart_kind": "",
                "has_dart_tests": "false",
              }
            kind = "dart"
            try:
              text = open("pubspec.yaml", "r", encoding="utf-8", errors="replace").read()
              if re.search(r"^\s*sdk\s*:\s*flutter\b", text, re.M):
                kind = "flutter"
            except OSError:
              pass
            hasTests = any(
              p.startswith("test/") and p.endswith("_test.dart") and os.path.isfile(p)
              for p in trackedFiles
            )
            return {
              "has_dart_flutter": "true",
              "dart_kind": kind,
              "has_dart_tests": "true" if hasTests else "false",
            }


          def detectDotnet(trackedFiles):
            empty = {
              "has_dotnet": "false",
              "dotnet_target": "",
              "dotnet_global_json": "",
              "dotnet_versions": "",
              "has_dotnet_tests": "false",
            }
            # Unity プロジェクト（ProjectSettings/ あり）の .csproj は dotnet CLI ではビルドできないため除外
            if os.path.isdir("ProjectSettings"):
              return empty

            entries = sorted(os.listdir("."))
            slns = [e for e in entries if os.path.isfile(e) and e.endswith((".sln", ".slnx"))]
            rootProjs = [e for e in entries if os.path.isfile(e) and e.endswith((".csproj", ".fsproj"))]
            if not slns and not rootProjs:
              return empty

            # 複数ファイル同居による MSB1011 エラーを防ぐためビルド対象を 1 つ明示する
            targetFile = slns[0] if slns else rootProjs[0]
            globalJson = "global.json" if os.path.isfile("global.json") else ""

            sdkMajors = set()
            if targetFile.endswith(".slnx"):
              sdkMajors.add(9)

            hasTests = False
            hasMobileOnlyWorkload = False
            projFiles = [p for p in trackedFiles if p.endswith((".csproj", ".fsproj")) and os.path.isfile(p)]
            if not projFiles:
              projFiles = rootProjs
            inspectFiles = list(projFiles)
            for props in ("Directory.Build.props",):
              if os.path.isfile(props):
                inspectFiles.append(props)

            for fp in inspectFiles:
              try:
                content = open(fp, "r", encoding="utf-8", errors="replace").read()
              except OSError:
                continue
              for m in re.finditer(r"\bnet(\d+)\.0\b", content):
                major = int(m.group(1))
                if major >= 6:
                  sdkMajors.add(major)
              if re.search(r"\bnet\d+\.0-(?:ios|android|maccatalyst|tizen)\b", content):
                hasMobileOnlyWorkload = True
              if "Microsoft.NET.Test.Sdk" in content or "<IsTestProject>true</IsTestProject>" in content:
                hasTests = True

            # MAUI / iOS / Android 専用ワークロードを含む場合は Linux 標準ランナーで失敗するため除外
            if hasMobileOnlyWorkload:
              return empty

            versionsStr = "\n".join(f"{m}.0.x" for m in sorted(sdkMajors)) if sdkMajors else "9.0.x"
            return {
              "has_dotnet": "true",
              "dotnet_target": targetFile,
              "dotnet_global_json": globalJson,
              "dotnet_versions": versionsStr,
              "has_dotnet_tests": "true" if hasTests else "false",
            }


          def main():
            tracked = gitTrackedFiles()
            outputs = {}
            outputs.update(detectNode())
            outputs.update(detectPython(tracked))
            outputs.update(detectApple())
            outputs.update(detectDartFlutter(tracked))
            outputs.update(detectDotnet(tracked))

            outputPath = os.environ.get("GITHUB_OUTPUT")
            if outputPath:
              with open(outputPath, "a", encoding="utf-8") as f:
                for k, v in outputs.items():
                  if "\n" in v:
                    f.write(f"{k}<<GH_OUTPUT_EOF\n{v}\nGH_OUTPUT_EOF\n")
                  else:
                    f.write(f"{k}={v}\n")

            for k, v in outputs.items():
              print(f"detect: {k}={v!r}")


          if __name__ == "__main__":
            main()
          PYEOF

      - name: Run repository quality & security checks
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import plistlib
          import re
          import shutil
          import subprocess
          import sys

          try:
            import tomllib
          except ImportError:
            tomllib = None

          try:
            import yaml
          except ImportError:
            yaml = None

          # =====================================================================
          # 設定（リポジトリの要件に合わせて調整できます）
          # =====================================================================
          ENABLE_NO_EMOJI = True
          ENABLE_SECRET_SCAN = True
          ENABLE_HYGIENE = True
          ENABLE_SYNTAX = True

          # 巨大ファイルの上限（MB）※ 3D モデルや動画素材がある場合は LFS 利用または上限調整を推奨
          MAX_FILE_SIZE_MB = 10

          # 行末等にこのマーカーを含む行は，絵文字・シークレット・コンフリクト検査をスキップ
          IGNORE_MARKER = "ci-" + "ignore"

          # ロックファイル（機械生成のため絵文字・シークレット検査から除外）
          EXCLUDED_LOCKFILES = {
            "package-lock.json",
            "yarn.lock",
            "pnpm-lock.yaml",
            "uv.lock",
            "poetry.lock",
            "Cargo.lock",
            "Pipfile.lock",
            "bun.lock",
            "Package.resolved",
            "Podfile.lock",
            "pubspec.lock",
            "Gemfile.lock",
          }

          # Firebase / FlutterFire のクライアント公開設定（AIza... は公開前提の識別子のため既定で除外）
          ALLOWED_SECRET_BASENAMES = {
            "GoogleService-Info.plist",
            "google-services.json",
            "firebase_options.dart",
          }

          # 特定パスを例外にしたい場合は先頭パスを追加
          ALLOWED_EMOJI_PATH_PREFIXES = []
          ALLOWED_SECRET_PATH_PREFIXES = []

          # JSONC（コメントや末尾カンマを許容する JSON）として構文チェックを除外する対象
          JSONC_BASENAMES = {
            "biome.json",
            ".eslintrc.json",
            ".devcontainer.json",
            "turbo.json",
            "wrangler.json",
            "tslint.json",
          }
          JSONC_DIR_PREFIXES = (".vscode/", ".devcontainer/")

          # Ruby 構文チェック対象の特別ファイル名
          RUBY_SPECIAL_BASENAMES = {"Podfile", "Gemfile", "Fastfile", "Appfile", "Matchfile", "Rakefile", "Brewfile"}

          # 絵文字として扱うコードポイントの範囲
          # 星(U+2605)や音符(U+266A)などの日本語でよく使う記号を巻き込まないよう絞っている
          EMOJI_RANGES = [
            (0x1F000, 0x1FAFF),
            (0x231A, 0x231B),
            (0x23E9, 0x23EC),
            (0x23F0, 0x23F0),
            (0x23F3, 0x23F3),
            (0x25FD, 0x25FE),
            (0x2614, 0x2615),
            (0x2648, 0x2653),
            (0x267F, 0x267F),
            (0x2693, 0x2693),
            (0x26A0, 0x26A1),
            (0x26AA, 0x26AB),
            (0x26BD, 0x26BE),
            (0x26C4, 0x26C5),
            (0x26CE, 0x26CE),
            (0x26D4, 0x26D4),
            (0x26EA, 0x26EA),
            (0x26F2, 0x26F3),
            (0x26F5, 0x26F5),
            (0x26FA, 0x26FA),
            (0x26FD, 0x26FD),
            (0x2705, 0x2705),
            (0x270A, 0x270B),
            (0x2714, 0x2714),
            (0x2716, 0x2716),
            (0x2728, 0x2728),
            (0x274C, 0x274C),
            (0x274E, 0x274E),
            (0x2753, 0x2755),
            (0x2757, 0x2757),
            (0x2764, 0x2764),
            (0x2795, 0x2797),
            (0x27A1, 0x27A1),
            (0x27B0, 0x27B0),
            (0x27BF, 0x27BF),
            (0x2B05, 0x2B07),
            (0x2B1B, 0x2B1C),
            (0x2B50, 0x2B50),
            (0x2B55, 0x2B55),
            (0xFE0F, 0xFE0F),
          ]

          EMOJI_PATTERN = re.compile("[" + "".join(f"{chr(s)}-{chr(e)}" for s, e in EMOJI_RANGES) + "]")

          # 機密ファイル名ルール
          # ※ .pem は公開証明書 / CA バンドルへの誤検知を防ぐため，秘密鍵ヘッダーの内容検査で検出する
          # ※ .key は macOS Keynote（ZIP バイナリ）への誤検知を避けるため別途バイナリ判定する
          SENSITIVE_EXACT_NAMES = {
            "id_rsa",
            "id_dsa",
            "id_ecdsa",
            "id_ed25519",
            ".netrc",
            ".htpasswd",
            "credentials.json",
          }
          SENSITIVE_EXTENSIONS = {".p8", ".p12", ".pfx", ".jks", ".keystore"}
          ALLOWED_ENV_SUFFIXES = {"example", "sample", "template", "schema", "dist", "defaults", "test"}

          # 高確度シークレットパターン（自己誤検知を避けるため文字列連結で構築）
          # ハイフンを含み得るキーの末尾は \b ではなく (?![A-Za-z0-9_-]) を使って末尾 '-' の漏れを防ぐ
          SECRET_PATTERNS = [
            ("Private Key", re.compile("-" * 5 + r"BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY" + "-" * 5)),
            ("AWS Access Key", re.compile(r"\b(?:AK" + r"IA|AS" + r"IA)[0-9A-Z]{16}\b")),
            ("GitHub Token", re.compile(r"\b(?:gh" + r"p|gh" + r"o|gh" + r"u|gh" + r"s|gh" + r"r)_[A-Za-z0-9]{36}\b")),
            ("GitHub Fine-Grained PAT", re.compile(r"\bgithub_" + r"pat_[A-Za-z0-9_]{22,}\b")),
            ("GitLab PAT", re.compile(r"\bgl" + r"pat-[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_-])")),
            ("Anthropic API Key", re.compile(r"\bsk-" + r"ant-[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_-])")),
            ("OpenAI API Key", re.compile(r"\bsk-(?:pr" + r"oj|svc" + r"acct|ad" + r"min)-[A-Za-z0-9_-]{20,}(?![A-Za-z0-9_-])")),
            ("Google API Key", re.compile(r"\bAI" + r"za[0-9A-Za-z_-]{35}(?![A-Za-z0-9_-])")),
            ("Google OAuth Secret", re.compile(r"\bGOC" + r"SPX-[A-Za-z0-9_-]{24,}(?![A-Za-z0-9_-])")),
            ("Slack Token", re.compile(r"\bxo" + r"x[baprs]-[0-9A-Za-z-]{10,}(?![A-Za-z0-9-])")),
            ("Slack Webhook URL", re.compile(r"https://hooks\.sl" + r"ack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+")),
            ("Discord Webhook URL", re.compile(r"https://(?:ptb\.|canary\.)?dis" + r"cord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+")),
            ("Stripe Live Key", re.compile(r"\b[rs]k_" + r"live_[0-9A-Za-z]{20,}\b")),
            ("SendGrid API Key", re.compile(r"\bS" + r"G\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])")),
            ("npm Token", re.compile(r"\bnp" + r"m_[A-Za-z0-9]{36}\b")),
            ("Hugging Face Token", re.compile(r"\bh" + r"f_[A-Za-z0-9]{30,}\b")),
          ]

          PLACEHOLDER_HINTS = (
            "example",
            "sample",
            "dummy",
            "placeholder",
            "changeme",
            "your_",
            "your-",
            "xxxx",
            "00000000",
            "12345678",
          )

          DOCKER_INSTRUCTIONS = {
            "FROM", "RUN", "CMD", "LABEL", "MAINTAINER", "EXPOSE", "ENV",
            "ADD", "COPY", "ENTRYPOINT", "VOLUME", "USER", "WORKDIR", "ARG",
            "ONBUILD", "STOPSIGNAL", "HEALTHCHECK", "SHELL",
          }

          CONFLICT_START = "<" * 7 + " "
          CONFLICT_END = ">" * 7 + " "

          BINARY_CHECK_BYTES = 8000
          HAS_RUBY = shutil.which("ruby") is not None
          HAS_NODE = shutil.which("node") is not None
          HAS_SHELLCHECK = shutil.which("shellcheck") is not None
          HAS_PACKAGE_JSON = os.path.isfile("package.json")
          ERROR_DETAILS = []


          def escapeProp(value):
            return (
              str(value)
              .replace("%", "%25")
              .replace("\r", "%0D")
              .replace("\n", "%0A")
              .replace(":", "%3A")
              .replace(",", "%2C")
            )


          def escapeData(value):
            return str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def emitAnnotation(level, message, filePath=None, line=None, col=None):
            props = []
            if filePath is not None:
              props.append(f"file={escapeProp(filePath)}")
            if line is not None:
              props.append(f"line={line}")
            if col is not None:
              props.append(f"col={col}")
            propStr = (" " + ",".join(props)) if props else ""
            print(f"::{level}{propStr}::{escapeData(message)}")
            if level == "error" and len(ERROR_DETAILS) < 50:
              loc = filePath or "(repo)"
              if line is not None:
                loc = f"{loc}:{line}"
              ERROR_DETAILS.append(f"- `{loc}`: {message}")


          def listTrackedFiles():
            try:
              res = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True)
            except (subprocess.CalledProcessError, FileNotFoundError) as err:
              emitAnnotation("error", f"git ls-files の実行に失敗しました: {err}")
              sys.exit(2)
            return [p for p in os.fsdecode(res.stdout).split("\0") if p]


          def readFileBytes(path):
            try:
              with open(path, "rb") as f:
                return f.read()
            except OSError as err:
              emitAnnotation("warning", f"読み込めませんでした: {err}", filePath=path)
              return None


          def isBinaryBytes(data):
            return b"\0" in data[:BINARY_CHECK_BYTES]


          def isSensitiveFileName(path, headBytes):
            base = os.path.basename(path)
            lower = base.lower()
            if lower in SENSITIVE_EXACT_NAMES:
              return True
            if lower.startswith("service-account") and lower.endswith(".json"):
              return True
            if lower.startswith("authkey_") and lower.endswith(".p8"):
              return True
            _, ext = os.path.splitext(lower)
            if ext in SENSITIVE_EXTENSIONS:
              return True
            if ext == ".key":
              # macOS Keynote (.key) は ZIP バイナリのため誤検知を除外
              if headBytes.startswith(b"PK\x03\x04"):
                return False
              return True
            if lower == ".env" or lower.startswith(".env."):
              if lower == ".env":
                return True
              segments = set(lower.split(".")[2:])
              if not (segments & ALLOWED_ENV_SUFFIXES):
                return True
            return False


          def isPlaceholderMatch(matched):
            lower = matched.lower()
            return any(hint in lower for hint in PLACEHOLDER_HINTS)


          def isJsoncFile(path):
            base = os.path.basename(path)
            if base in JSONC_BASENAMES:
              return True
            if (base.startswith("tsconfig") or base.startswith("jsconfig")) and base.endswith(".json"):
              return True
            return path.startswith(JSONC_DIR_PREFIXES)


          def isDockerfile(base):
            return base == "Dockerfile" or base.startswith("Dockerfile.") or base.endswith(".Dockerfile")


          def isRubyFile(base, ext):
            return ext in (".rb", ".podspec") or base in RUBY_SPECIAL_BASENAMES


          def detectShellKind(ext, firstLine):
            if ext == ".zsh":
              return "zsh"
            if ext == ".bash":
              return "bash"
            if ext == ".sh":
              if "zsh" in firstLine:
                return "zsh"
              if "/bin/sh" in firstLine or "env sh" in firstLine:
                return "sh"
              return "bash"
            # 拡張子なしスクリプトの shebang 判定（bin/* などの実行スクリプトを対象化）
            if not ext and firstLine.startswith("#!"):
              if re.search(r"(?:/|\benv\s+(?:-\S+\s+)*)zsh\b", firstLine):
                return "zsh"
              if re.search(r"(?:/|\benv\s+(?:-\S+\s+)*)bash\b", firstLine):
                return "bash"
              if re.search(r"(?:/|\benv\s+(?:-\S+\s+)*)sh\b", firstLine):
                return "sh"
            return None


          def validateYaml(path, text):
            # Helm / Go テンプレート等は YAML 検証対象外
            if "{{" in text and "}}" in text and not path.startswith(".github/"):
              return None
            # カスタムタグ（mkdocs の !!python/name: や CloudFormation の !Ref 等）を誤検知しないよう
            # オブジェクト構築せず純粋な構文解析（compose / parse_stream）のみ行う
            if yaml is not None:
              try:
                loader = getattr(yaml, "CSafeLoader", yaml.SafeLoader)
                list(yaml.compose_all(text, Loader=loader))
              except yaml.YAMLError as err:
                return str(err).splitlines()[0]
              return None
            if HAS_RUBY:
              res = subprocess.run(
                ["ruby", "-rpsych", "-e", "Psych.parse_stream(File.read(ARGV[0]))", "--", path],
                capture_output=True,
                text=True,
              )
              if res.returncode != 0:
                msg = (res.stderr or res.stdout).strip().splitlines()
                return msg[0] if msg else "YAML syntax error"
            return None


          def validateShell(path, shellKind):
            errors = []
            if shutil.which(shellKind) is not None:
              res = subprocess.run([shellKind, "-n", "--", path], capture_output=True, text=True)
              if res.returncode != 0:
                msg = (res.stderr or res.stdout).strip().splitlines()
                errors.append((None, None, msg[0] if msg else f"{shellKind} -n failed"))
                return errors
            # sh / bash かつ shellcheck が利用可能な場合は重大エラー（-S error）のみ検査
            if shellKind in ("sh", "bash") and HAS_SHELLCHECK:
              res = subprocess.run(
                ["shellcheck", "-s", shellKind, "-S", "error", "-f", "gcc", "--", path],
                capture_output=True,
                text=True,
              )
              if res.returncode != 0:
                for line in res.stdout.splitlines():
                  m = re.match(r"^.*?:(\d+):(\d+):\s*(?:error|warning|note):\s*(.+)$", line)
                  if m:
                    errors.append((int(m.group(1)), int(m.group(2)), m.group(3)))
                  elif line.strip():
                    errors.append((None, None, line.strip()))
            return errors


          def validateRuby(path):
            if not HAS_RUBY:
              return None
            res = subprocess.run(["ruby", "-c", "--", path], capture_output=True, text=True)
            if res.returncode != 0:
              msg = (res.stderr or res.stdout).strip().splitlines()
              return msg[0] if msg else "Ruby syntax error"
            return None


          def validatePlainJs(path):
            # package.json があるリポは node ジョブに委譲し，素の JS（静的 Web / 単体スクリプト）のみ検証する
            if HAS_PACKAGE_JSON or not HAS_NODE or path.endswith(".min.js"):
              return None
            res = subprocess.run(["node", "--check", "--", path], capture_output=True, text=True)
            if res.returncode != 0:
              combined = (res.stderr or res.stdout).strip()
              # 古い Node での ESM 誤判定のみ除外する（JSX を使う場合は package.json 配下での管理を想定）
              if "Cannot use import statement outside a module" in combined:
                return None
              lines = [ln for ln in combined.splitlines() if ln.strip()]
              return lines[-1] if lines else "JavaScript syntax error"
            return None


          def validateDockerfile(text):
            """Dockerfile の基本構造（FROM の存在，未知命令タイポ）をヒアドキュメント・escape 指令対応で検査する．"""
            errors = []
            hasFrom = False
            continuation = False
            heredocQueue = []
            escapeChar = "\\"
            sawNonComment = False

            for lineNum, rawLine in enumerate(text.splitlines(), start=1):
              if heredocQueue:
                if rawLine.strip() == heredocQueue[0]:
                  heredocQueue.pop(0)
                continue

              stripped = rawLine.strip()
              if not stripped:
                continue
              if stripped.startswith("#"):
                if not sawNonComment:
                  em = re.match(r"^#\s*escape\s*=\s*([\\`])\s*$", stripped, re.I)
                  if em:
                    escapeChar = em.group(1)
                continue

              sawNonComment = True
              if not continuation:
                token = stripped.split(None, 1)[0].upper()
                if token not in DOCKER_INSTRUCTIONS:
                  errors.append((lineNum, f"未知の Dockerfile 命令です: {token}"))
                elif token == "FROM":
                  hasFrom = True

              # 1 行に複数のヒアドキュメント（例: COPY <<A <<B /dst）にも対応
              markers = re.findall(r"<<-?\s*['\"]?([A-Za-z_][A-Za-z0-9_]*)['\"]?", stripped)
              if markers:
                heredocQueue.extend(markers)
                continuation = False
              else:
                continuation = stripped.endswith(escapeChar)

            if not hasFrom:
              errors.append((1, "Dockerfile に FROM 命令が見つかりません"))
            return errors


          def writeSummary(counts):
            summaryPath = os.environ.get("GITHUB_STEP_SUMMARY")
            if not summaryPath:
              return
            labels = [
              ("no_emoji", "絵文字禁止 (lint-no-emoji)", ENABLE_NO_EMOJI),
              ("secrets", "シークレット・機密ファイル検出", ENABLE_SECRET_SCAN),
              ("hygiene", "リポジトリ衛生（コンフリクト / 巨大ファイル）", ENABLE_HYGIENE),
              ("syntax", "構文チェック (JSON/TOML/YAML/Plist/Shell/Ruby/JS/Dockerfile)", ENABLE_SYNTAX),
            ]
            lines = [
              "### 共通チェック結果",
              "",
              "| チェック項目 | 状態 | 検出件数 |",
              "| --- | --- | ---: |",
            ]
            for key, title, enabled in labels:
              if not enabled:
                status = "スキップ"
                countStr = "-"
              elif counts[key] == 0:
                status = "OK"
                countStr = "0"
              else:
                status = "NG"
                countStr = str(counts[key])
              lines.append(f"| {title} | {status} | {countStr} |")
            lines.append("")
            # GitHub のエラー注釈は 1 ステップ 10 件上限のため，詳細を Summary にも一覧出力する
            if ERROR_DETAILS:
              lines.append("<details><summary>検出した問題の詳細（最大 50 件）</summary>")
              lines.append("")
              lines.extend(ERROR_DETAILS)
              lines.append("")
              lines.append("</details>")
              lines.append("")
            with open(summaryPath, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")


          def main():
            counts = {"no_emoji": 0, "secrets": 0, "hygiene": 0, "syntax": 0}
            maxBytes = MAX_FILE_SIZE_MB * 1024 * 1024

            for path in listTrackedFiles():
              if not os.path.isfile(path) or os.path.islink(path):
                continue

              base = os.path.basename(path)
              _, ext = os.path.splitext(base.lower())
              isLockfile = base in EXCLUDED_LOCKFILES
              isSecretAllowed = (
                base in ALLOWED_SECRET_BASENAMES
                or any(path.startswith(p) for p in ALLOWED_SECRET_PATH_PREFIXES)
              )

              try:
                size = os.path.getsize(path)
              except OSError:
                size = 0

              # 先頭数バイトだけ読んで Keynote 判定等に使う（巨大ファイルの全量読込を避ける）
              headBytes = b""
              try:
                with open(path, "rb") as f:
                  headBytes = f.read(16)
              except OSError:
                pass

              # 1. 機密ファイル名チェック
              if ENABLE_SECRET_SCAN and not isSecretAllowed:
                if isSensitiveFileName(path, headBytes):
                  emitAnnotation(
                    "error",
                    "機密ファイルの可能性があるファイルが追跡されています（.gitignore への追加を検討してください）",
                    filePath=path,
                  )
                  counts["secrets"] += 1

              # 2. 巨大ファイルチェック（超過ファイルはメモリ保護のため中身を全量読み込みしない）
              if ENABLE_HYGIENE and size > maxBytes:
                sizeMb = size / (1024 * 1024)
                emitAnnotation(
                  "error",
                  f"ファイルサイズが上限（{MAX_FILE_SIZE_MB}MB）を超えています（{sizeMb:.1f}MB）",
                  filePath=path,
                )
                counts["hygiene"] += 1
                continue

              data = readFileBytes(path)
              if data is None:
                continue

              # Apple 向け Plist / Entitlements / PrivacyInfo.xcprivacy はバイナリ形式も含め構文検証
              if ENABLE_SYNTAX and ext in (".plist", ".entitlements", ".xcprivacy"):
                try:
                  plistlib.loads(data)
                except Exception as err:
                  emitAnnotation("error", f"Plist 構文エラー: {err}", filePath=path)
                  counts["syntax"] += 1

              if isBinaryBytes(data):
                continue

              strictUtf8 = True
              try:
                text = data.decode("utf-8")
              except UnicodeDecodeError:
                strictUtf8 = False
                text = data.decode("utf-8", errors="replace")

              lines = text.split("\n")

              # 3. 絵文字禁止チェック
              if ENABLE_NO_EMOJI and strictUtf8 and not isLockfile and not any(path.startswith(p) for p in ALLOWED_EMOJI_PATH_PREFIXES):
                for lineNum, line in enumerate(lines, start=1):
                  if IGNORE_MARKER in line:
                    continue
                  for match in EMOJI_PATTERN.finditer(line):
                    cp = ord(match.group())
                    emitAnnotation(
                      "error",
                      f"絵文字 U+{cp:04X} が含まれています",
                      filePath=path,
                      line=lineNum,
                      col=match.start() + 1,
                    )
                    counts["no_emoji"] += 1

              # 4. テキスト内シークレット検出（finditer で同一行内の全候補を検査，非 UTF-8 テキストも対象）
              if ENABLE_SECRET_SCAN and not isLockfile and not isSecretAllowed:
                for lineNum, line in enumerate(lines, start=1):
                  if IGNORE_MARKER in line:
                    continue
                  for label, pattern in SECRET_PATTERNS:
                    for match in pattern.finditer(line):
                      if not isPlaceholderMatch(match.group(0)):
                        emitAnnotation(
                          "error",
                          f"{label} の可能性があります（意図的なテストデータの場合は行に {IGNORE_MARKER} を付与してください）",
                          filePath=path,
                          line=lineNum,
                          col=match.start() + 1,
                        )
                        counts["secrets"] += 1

              # 5. マージコンフリクトマーカー残留チェック
              # 開始 (<<<<<<< ) / 終了 (>>>>>>> ) は片割れでも検出（単独の ======= は Markdown 見出しのため無視）
              if ENABLE_HYGIENE:
                for lineNum, line in enumerate(lines, start=1):
                  if IGNORE_MARKER in line:
                    continue
                  if line.startswith(CONFLICT_START) or line.startswith(CONFLICT_END):
                    emitAnnotation(
                      "error",
                      "マージコンフリクトのマーカーが残っています",
                      filePath=path,
                      line=lineNum,
                    )
                    counts["hygiene"] += 1

              # 6. 構文チェック (JSON / TOML / YAML / Shell / Ruby / 素の JS / Dockerfile)
              if ENABLE_SYNTAX and strictUtf8:
                firstLine = lines[0] if lines else ""
                shellKind = detectShellKind(ext, firstLine)

                if ext in (".json", ".xcstrings") and not isJsoncFile(path):
                  try:
                    # BOM 付き JSON を許容するため utf-8-sig でデコード
                    json.loads(data.decode("utf-8-sig"))
                  except json.JSONDecodeError as err:
                    emitAnnotation(
                      "error",
                      f"JSON 構文エラー: {err.msg}",
                      filePath=path,
                      line=err.lineno,
                      col=err.colno,
                    )
                    counts["syntax"] += 1
                elif ext == ".toml" and tomllib is not None:
                  try:
                    tomllib.loads(data.decode("utf-8-sig"))
                  except tomllib.TOMLDecodeError as err:
                    emitAnnotation("error", f"TOML 構文エラー: {err}", filePath=path)
                    counts["syntax"] += 1
                elif ext in (".yml", ".yaml"):
                  yamlErr = validateYaml(path, text)
                  if yamlErr:
                    emitAnnotation("error", f"YAML 構文エラー: {yamlErr}", filePath=path)
                    counts["syntax"] += 1
                elif shellKind is not None:
                  for errLine, errCol, errMsg in validateShell(path, shellKind):
                    emitAnnotation("error", f"Shell チェックエラー: {errMsg}", filePath=path, line=errLine, col=errCol)
                    counts["syntax"] += 1
                elif isRubyFile(base, ext):
                  rbErr = validateRuby(path)
                  if rbErr:
                    emitAnnotation("error", f"Ruby 構文エラー: {rbErr}", filePath=path)
                    counts["syntax"] += 1
                elif ext in (".js", ".mjs", ".cjs"):
                  jsErr = validatePlainJs(path)
                  if jsErr:
                    emitAnnotation("error", f"JavaScript 構文エラー: {jsErr}", filePath=path)
                    counts["syntax"] += 1
                elif isDockerfile(base):
                  for errLine, errMsg in validateDockerfile(text):
                    emitAnnotation("error", f"Dockerfile チェックエラー: {errMsg}", filePath=path, line=errLine)
                    counts["syntax"] += 1

            writeSummary(counts)
            totalErrors = sum(counts.values())
            if totalErrors > 0:
              print(f"チェック失敗: 合計 {totalErrors} 件の問題を検出しました（{counts}）")
              sys.exit(1)
            print("成功: 共通チェックで問題は検出されませんでした．")


          if __name__ == "__main__":
            main()
          PYEOF

  node:
    name: Node.js チェック (${{ needs.repo-checks.outputs.node_pm }})
    needs: repo-checks
    if: ${{ !cancelled() && needs.repo-checks.outputs.has_node == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm (from packageManager)
        if: ${{ needs.repo-checks.outputs.node_pm == 'pnpm' && needs.repo-checks.outputs.node_has_pm_field == 'true' }}
        uses: pnpm/action-setup@v4

      - name: Set up pnpm (default version)
        if: ${{ needs.repo-checks.outputs.node_pm == 'pnpm' && needs.repo-checks.outputs.node_has_pm_field != 'true' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Bun
        if: ${{ needs.repo-checks.outputs.node_pm == 'bun' }}
        uses: oven-sh/setup-bun@v2

      # Yarn Berry (yarn@2+ / .yarnrc.yml) の場合は setup-node の cache が Yarn 1.22 と衝突するため，
      # cache を無効にしてセットアップ後に Corepack を有効化する（Yarn 1.x 明示時は cache を維持）
      - name: Set up Node.js
        if: ${{ needs.repo-checks.outputs.node_pm != 'bun' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ needs.repo-checks.outputs.node_version_file == '' && '22' || '' }}
          node-version-file: ${{ needs.repo-checks.outputs.node_version_file }}
          cache: ${{ (needs.repo-checks.outputs.node_has_lockfile == 'true' && needs.repo-checks.outputs.node_yarn_berry != 'true') && needs.repo-checks.outputs.node_pm || '' }}

      - name: Enable Corepack for Yarn Berry
        if: ${{ needs.repo-checks.outputs.node_yarn_berry == 'true' }}
        run: |
          if ! command -v corepack >/dev/null 2>&1; then
            npm install -g corepack
          fi
          corepack enable

      - name: Install dependencies
        env:
          PM: ${{ needs.repo-checks.outputs.node_pm }}
          HAS_LOCK: ${{ needs.repo-checks.outputs.node_has_lockfile }}
        run: |
          case "$PM" in
            pnpm)
              if [ "$HAS_LOCK" = "true" ]; then
                pnpm install --frozen-lockfile
              else
                pnpm install --no-frozen-lockfile
              fi
              ;;
            yarn)
              YARN_MAJOR="$(yarn --version | cut -d. -f1)"
              if [ "$HAS_LOCK" = "true" ]; then
                if [ "$YARN_MAJOR" = "1" ]; then
                  yarn install --frozen-lockfile
                else
                  yarn install --immutable
                fi
              else
                if [ "$YARN_MAJOR" = "1" ]; then
                  yarn install
                else
                  yarn install --no-immutable
                fi
              fi
              ;;
            bun)
              if [ "$HAS_LOCK" = "true" ]; then bun install --frozen-lockfile; else bun install; fi
              ;;
            *)
              if [ "$HAS_LOCK" = "true" ]; then npm ci; else npm install; fi
              ;;
          esac

      - name: Run available package scripts (lint / typecheck / format / test / build)
        env:
          PM: ${{ needs.repo-checks.outputs.node_pm }}
        run: |
          run_script() {
            local name="$1"
            echo "=== Running script: $name ==="
            case "$PM" in
              pnpm) pnpm run "$name" ;;
              yarn) yarn run "$name" ;;
              bun)  bun run "$name" ;;
              *)    npm run "$name" ;;
            esac
          }

          has_script() {
            # Bun 環境でも引数位置ずれを避けるため，ランナー標準の node と環境変数で判定する
            SCRIPT_NAME="$1" node -e '
              const fs = require("fs");
              const raw = fs.readFileSync("package.json", "utf8").replace(/^\uFEFF/, "");
              const pkg = JSON.parse(raw);
              const scripts = pkg.scripts || {};
              const name = process.env.SCRIPT_NAME || "";
              if (!Object.prototype.hasOwnProperty.call(scripts, name)) process.exit(1);
              const cmd = String(scripts[name] || "").trim();
              if (!cmd) process.exit(1);
              // npm init 直後のダミー test スクリプトは無視する
              if (name === "test" && cmd.includes("no test specified")) process.exit(1);
              process.exit(0);
            '
          }

          RAN_ANY=false
          run_first_available() {
            local candidate
            for candidate in "$@"; do
              if has_script "$candidate"; then
                run_script "$candidate"
                RAN_ANY=true
                return 0
              fi
            done
          }

          run_first_available "lint"
          run_first_available "typecheck" "type-check"
          run_first_available "format:check" "check:format"
          run_first_available "test"
          # macOS 専用ビルド（electron-builder --mac 等）のリポでは build 行をコメントアウトしてください
          run_first_available "build"

          if [ "$RAN_ANY" = false ]; then
            echo "実行対象の package.json scripts（lint/typecheck/format:check/test/build）が見つからなかったためスキップしました．"
          fi

      - name: Audit dependencies (high+ vulnerabilities)
        if: ${{ needs.repo-checks.outputs.node_has_lockfile == 'true' }}
        # 厳格に CI を落としたい場合は continue-on-error を false に変更してください
        continue-on-error: true
        env:
          PM: ${{ needs.repo-checks.outputs.node_pm }}
        run: |
          set +e
          case "$PM" in
            pnpm)
              pnpm audit --audit-level=high
              STATUS=$?
              ;;
            yarn)
              YARN_MAJOR="$(yarn --version | cut -d. -f1)"
              if [ "$YARN_MAJOR" = "1" ]; then
                yarn audit --level high
              else
                yarn npm audit --all --recursive --severity high
              fi
              STATUS=$?
              ;;
            bun)
              bun audit --audit-level=high
              STATUS=$?
              ;;
            *)
              npm audit --audit-level=high
              STATUS=$?
              ;;
          esac
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::依存パッケージに high 以上の脆弱性が検出されました（$PM audit をローカルで確認してください）"
            exit "$STATUS"
          fi

  python:
    name: Python チェック (${{ needs.repo-checks.outputs.python_installer }})
    needs: repo-checks
    if: ${{ !cancelled() && needs.repo-checks.outputs.has_python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up uv
        if: ${{ needs.repo-checks.outputs.python_installer == 'uv' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: ${{ needs.repo-checks.outputs.python_installer != 'uv' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.repo-checks.outputs.python_version }}
          python-version-file: ${{ needs.repo-checks.outputs.python_version_file }}

      - name: Install Python dependencies
        if: ${{ needs.repo-checks.outputs.has_python_deps == 'true' }}
        env:
          INSTALLER: ${{ needs.repo-checks.outputs.python_installer }}
          HAS_BUILD_SYSTEM: ${{ needs.repo-checks.outputs.python_has_build_system }}
          HAS_PYPROJECT_DEPS: ${{ needs.repo-checks.outputs.python_has_pyproject_deps }}
          HAS_DEV_EXTRA: ${{ needs.repo-checks.outputs.python_has_dev_extra }}
          HAS_DEV_GROUP: ${{ needs.repo-checks.outputs.python_has_dev_group }}
        run: |
          if [ "$INSTALLER" = "uv" ]; then
            UV_ARGS=(--locked)
            if [ "$HAS_DEV_EXTRA" = "true" ]; then
              UV_ARGS+=(--extra dev)
            fi
            uv sync "${UV_ARGS[@]}"
          else
            python -m pip install --upgrade pip
            if [ "$HAS_BUILD_SYSTEM" = "true" ]; then
              if [ "$HAS_DEV_EXTRA" = "true" ]; then
                python -m pip install -e ".[dev]"
              else
                python -m pip install -e .
              fi
            elif [ "$HAS_PYPROJECT_DEPS" = "true" ] || [ "$HAS_DEV_EXTRA" = "true" ]; then
              # build-system が無いアプリ型 pyproject.toml（uv init 等）は -e . せず依存のみ直接入れる
              python - << 'PYEOF'
          import subprocess, sys, tomllib
          with open("pyproject.toml", "rb") as f:
            data = tomllib.load(f)
          project = data.get("project", {})
          deps = list(project.get("dependencies") or [])
          opt = project.get("optional-dependencies") or {}
          if isinstance(opt.get("dev"), list):
            deps.extend(opt["dev"])
          if deps:
            subprocess.run([sys.executable, "-m", "pip", "install", *deps], check=True)
          PYEOF
            fi
            if [ "$HAS_DEV_GROUP" = "true" ]; then
              PIP_HELP="$(python -m pip install --help)"
              if grep -q -- '--group' <<<"$PIP_HELP"; then
                python -m pip install --group dev
              else
                echo "::warning::使用中の pip が --group (PEP 735) に未対応のため [dependency-groups].dev のインストールをスキップしました．"
              fi
            fi
            if [ -f "requirements-dev.txt" ]; then
              python -m pip install -r requirements-dev.txt
            fi
            if [ -f "requirements.txt" ]; then
              python -m pip install -r requirements.txt
            fi
          fi

      - name: Check Python syntax (py_compile)
        env:
          INSTALLER: ${{ needs.repo-checks.outputs.python_installer }}
        run: |
          if [ "$INSTALLER" = "uv" ]; then
            PY_CMD=(uv run --no-sync python)
          else
            PY_CMD=(python)
          fi
          "${PY_CMD[@]}" - << 'PYEOF'
          import os
          import py_compile
          import subprocess
          import sys

          res = subprocess.run(["git", "ls-files", "-z", "*.py"], check=True, capture_output=True)
          files = [p for p in os.fsdecode(res.stdout).split("\0") if p and os.path.isfile(p)]
          errors = 0
          for path in files:
            try:
              py_compile.compile(path, doraise=True)
            except py_compile.PyCompileError as err:
              escapedFile = path.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
              escapedMsg = str(err.msg).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error file={escapedFile}::Python 構文エラー: {escapedMsg}")
              errors += 1
          if errors > 0:
            sys.exit(1)
          print(f"成功: {len(files)} 件の Python ファイルに構文エラーはありませんでした．")
          PYEOF

      - name: Run Ruff lint (if configured or installed)
        env:
          INSTALLER: ${{ needs.repo-checks.outputs.python_installer }}
        run: |
          HAS_RUFF_CONFIG=false
          if [ -f "ruff.toml" ] || [ -f ".ruff.toml" ]; then
            HAS_RUFF_CONFIG=true
          elif [ -f "pyproject.toml" ] && grep -q "\[tool\.ruff" pyproject.toml; then
            HAS_RUFF_CONFIG=true
          fi

          if [ "$INSTALLER" = "uv" ]; then
            if uv run --no-sync ruff --version >/dev/null 2>&1; then
              uv run --no-sync ruff check .
            elif [ "$HAS_RUFF_CONFIG" = "true" ]; then
              uvx ruff check .
            else
              echo "ruff が未設定のためスキップしました．"
            fi
          else
            if command -v ruff >/dev/null 2>&1; then
              ruff check .
            elif [ "$HAS_RUFF_CONFIG" = "true" ]; then
              python -m pip install -q ruff
              ruff check .
            else
              echo "ruff が未設定のためスキップしました．"
            fi
          fi

      - name: Run Python tests
        if: ${{ needs.repo-checks.outputs.has_python_tests == 'true' }}
        env:
          INSTALLER: ${{ needs.repo-checks.outputs.python_installer }}
        run: |
          # pytest は unittest 形式も実行できるため pytest に一本化し，テスト 0 件（終了コード 5）を許容する
          set +e
          if [ "$INSTALLER" = "uv" ]; then
            if uv run --no-sync python -c "import pytest" >/dev/null 2>&1; then
              uv run --no-sync pytest
            else
              uv run --frozen --with pytest pytest
            fi
          else
            python -c "import pytest" >/dev/null 2>&1 || python -m pip install -q pytest
            python -m pytest
          fi
          CODE=$?
          set -e
          [ "$CODE" -eq 0 ] || [ "$CODE" -eq 5 ] || exit "$CODE"

      - name: Audit Python dependencies (pip-audit)
        if: ${{ needs.repo-checks.outputs.has_python_deps == 'true' }}
        # 厳格に CI を落としたい場合は continue-on-error を false に変更してください
        continue-on-error: true
        env:
          INSTALLER: ${{ needs.repo-checks.outputs.python_installer }}
        run: |
          set +e
          if [ "$INSTALLER" = "uv" ]; then
            uv export --frozen --no-hashes --no-emit-project --no-emit-workspace -o /tmp/requirements-audit.txt \
              && uvx pip-audit --no-deps --disable-pip -r /tmp/requirements-audit.txt
            STATUS=$?
          else
            python -m pip install -q pip-audit && python -m pip_audit
            STATUS=$?
          fi
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::warning::Python 依存パッケージに脆弱性が検出されました（pip-audit をローカルで確認してください）"
            exit "$STATUS"
          fi

  apple:
    name: iOS / macOS チェック (${{ needs.repo-checks.outputs.apple_kind }})
    needs: repo-checks
    # Private リポジトリでは macOS ランナーは無料枠を 10 倍消費します．
    # macOS ランナーでのビルドを止めたいリポジトリでは下の if を false に変更してください．
    if: ${{ !cancelled() && needs.repo-checks.outputs.has_apple == 'true' }}
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Xcode & Swift versions
        run: |
          xcodebuild -version
          swift --version

      # Pods/ を巻き込まないよう，pod install より先に SwiftLint を実行する
      - name: Run SwiftLint (if configured)
        if: ${{ needs.repo-checks.outputs.apple_has_swiftlint == 'true' }}
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint lint

      - name: Generate Xcode project (XcodeGen)
        if: ${{ needs.repo-checks.outputs.apple_kind == 'xcodegen' }}
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Install CocoaPods dependencies
        if: ${{ needs.repo-checks.outputs.apple_has_podfile == 'true' }}
        run: |
          pod install

      - name: Build & test Swift Package (SwiftPM)
        if: ${{ needs.repo-checks.outputs.apple_kind == 'spm' }}
        run: |
          python3 - << 'PYEOF'
          import json
          import subprocess
          import sys

          res = subprocess.run(["swift", "package", "dump-package"], check=True, capture_output=True, text=True)
          pkg = json.loads(res.stdout)
          pkgName = pkg.get("name", "")
          platforms = [str(p.get("platformName", "")).lower() for p in pkg.get("platforms", [])]
          hasTest = any(t.get("type") == "test" for t in pkg.get("targets", []))

          # platforms に iOS があり macOS が無い UIKit 専用パッケージは xcodebuild で iOS Simulator ビルドする
          iosOnly = bool(platforms) and ("ios" in platforms) and ("macos" not in platforms)
          if iosOnly and pkgName:
            print(f"iOS 専用 Swift Package ({pkgName}) として xcodebuild でビルド検証します．", flush=True)
            subprocess.run(
              [
                "xcodebuild",
                "-scheme", pkgName,
                "-destination", "generic/platform=iOS Simulator",
                "CODE_SIGNING_ALLOWED=NO",
                "CODE_SIGNING_REQUIRED=NO",
                "CODE_SIGN_IDENTITY=",
                "build",
              ],
              check=True,
            )
          else:
            subprocess.run(["swift", "build"], check=True)
            if hasTest:
              subprocess.run(["swift", "test"], check=True)
            else:
              print("SwiftPM テストターゲットが無いため swift test をスキップしました．")
          PYEOF

      - name: Build & test Xcode project / workspace (iOS & macOS auto-detect)
        if: ${{ needs.repo-checks.outputs.apple_kind != 'spm' }}
        env:
          APPLE_WORKSPACE: ${{ needs.repo-checks.outputs.apple_workspace }}
          APPLE_PROJECT: ${{ needs.repo-checks.outputs.apple_project }}
        run: |
          python3 - << 'PYEOF'
          from collections import deque
          import json
          import os
          import re
          import subprocess
          import sys


          def runCmd(cmd, check=True, capture=True):
            print("+", " ".join(cmd), flush=True)
            res = subprocess.run(cmd, check=False, capture_output=capture, text=True)
            if check and res.returncode != 0:
              if capture:
                if res.stdout:
                  sys.stdout.write(res.stdout)
                if res.stderr:
                  sys.stderr.write(res.stderr)
              sys.exit(res.returncode)
            return res


          def runStreaming(cmd):
            """ログをリアルタイム出力しつつ末尾 500 行を保持して返す．"""
            print("+", " ".join(cmd), flush=True)
            tail = deque(maxlen=500)
            proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
            assert proc.stdout is not None
            for line in proc.stdout:
              sys.stdout.write(line)
              sys.stdout.flush()
              tail.append(line)
            code = proc.wait()
            return code, "".join(tail)


          def resolveContainer():
            ws = os.environ.get("APPLE_WORKSPACE", "").strip()
            proj = os.environ.get("APPLE_PROJECT", "").strip()
            # pod install / xcodegen で後から生成された .xcworkspace を拾うため，ws が空なら必ず再走査する
            if not ws:
              entries = sorted(os.listdir("."))
              wsList = [e for e in entries if e.endswith(".xcworkspace") and os.path.isdir(e)]
              projList = [e for e in entries if e.endswith(".xcodeproj") and os.path.isdir(e)]
              if wsList:
                ws = wsList[0]
              if not proj and projList:
                proj = projList[0]
            if ws:
              return (["-workspace", ws], ws, proj)
            if proj:
              return (["-project", proj], proj, proj)
            print("::error::ビルド対象の .xcworkspace / .xcodeproj が見つかりませんでした．")
            sys.exit(1)


          def inspectPbxproj(projPath):
            """pbxproj から Unit Test / UI Test ターゲット名を抽出する．"""
            unitTests = []
            uiTests = []
            if not projPath:
              entries = sorted(os.listdir("."))
              projList = [e for e in entries if e.endswith(".xcodeproj") and os.path.isdir(e)]
              projPath = projList[0] if projList else ""
            pbx = os.path.join(projPath, "project.pbxproj") if projPath else ""
            if not pbx or not os.path.isfile(pbx):
              return unitTests, uiTests
            try:
              text = open(pbx, "r", encoding="utf-8", errors="replace").read()
            except OSError:
              return unitTests, uiTests
            pattern = re.compile(
              r"isa\s*=\s*PBXNativeTarget;.*?name\s*=\s*(?:\"([^\"]+)\"|([^\s;]+));.*?productType\s*=\s*\"([^\"]+)\";",
              re.S,
            )
            for m in pattern.finditer(text):
              name = m.group(1) or m.group(2)
              ptype = m.group(3)
              if ptype == "com.apple.product-type.bundle.unit-test":
                unitTests.append(name)
              elif ptype == "com.apple.product-type.bundle.ui-testing":
                uiTests.append(name)
            return unitTests, uiTests


          def pickSchemeOrTarget(containerArgs, containerName, projPath):
            res = runCmd(["xcodebuild", "-list", "-json", *containerArgs])
            # SPM の依存解決ログが JSON の前に混ざることがあるため，最初の '{' から raw_decode する
            start = res.stdout.find("{")
            if start < 0:
              print("::error::xcodebuild -list の出力から JSON を取得できませんでした．")
              sys.exit(1)
            data, _ = json.JSONDecoder().raw_decode(res.stdout[start:])
            info = data.get("workspace") or data.get("project") or {}
            schemes = info.get("schemes", [])
            targets = info.get("targets", [])

            # CocoaPods ワークスペースで Pods 側スキームを誤選択しないよう，プロジェクト名も優先候補に含める
            preferredNames = []
            for p in (projPath, containerName):
              if p:
                bn = os.path.splitext(os.path.basename(p))[0]
                if bn and bn not in preferredNames:
                  preferredNames.append(bn)

            if schemes:
              for pref in preferredNames:
                if pref in schemes:
                  return ("scheme", pref)
              nonTest = [s for s in schemes if not s.endswith("Tests") and not s.endswith("UITests")]
              if nonTest:
                return ("scheme", nonTest[0])
              return ("scheme", schemes[0])

            if targets:
              for pref in preferredNames:
                if pref in targets:
                  return ("target", pref)
              nonTest = [t for t in targets if not t.endswith("Tests") and not t.endswith("UITests")]
              if nonTest:
                return ("target", nonTest[0])
              return ("target", targets[0])

            print("::error::ビルド可能な scheme / target が見つかりませんでした．")
            sys.exit(1)


          def detectBuildSettings(containerArgs, kind, name):
            flag = "-scheme" if kind == "scheme" else "-target"
            res = runCmd(["xcodebuild", *containerArgs, flag, name, "-showBuildSettings"], check=False)
            supported = ""
            sdkroot = ""
            if res.returncode == 0:
              # 最初のターゲットブロックの値のみを採用し，後続テストターゲットによる上書きを防ぐ
              blockCount = 0
              for line in res.stdout.splitlines():
                stripped = line.strip()
                if stripped.startswith("Build settings for action "):
                  blockCount += 1
                  if blockCount > 1:
                    break
                  continue
                if stripped.startswith("SUPPORTED_PLATFORMS = ") and not supported:
                  supported = stripped.split(" = ", 1)[1].strip()
                elif stripped.startswith("SDKROOT = ") and not sdkroot:
                  sdkroot = stripped.split(" = ", 1)[1].strip()
            return supported, sdkroot


          def findIosSimulatorFromShowDestinations(containerArgs, kind, name):
            """選択中の Xcode とスキームが実際に使える iOS Simulator を -showdestinations から選ぶ．"""
            flag = "-scheme" if kind == "scheme" else "-target"
            res = runCmd(["xcodebuild", *containerArgs, flag, name, "-showdestinations"], check=False)
            if res.returncode != 0:
              return None
            candidates = []
            for line in res.stdout.splitlines():
              m = re.search(r"platform:iOS Simulator,.*?OS:([^,]+),.*?id:([0-9A-Fa-f-]{36}),.*?name:([^}]+)", line)
              if m and "iPhone" in m.group(3):
                osVer = m.group(1).strip()
                udid = m.group(2).strip()
                devName = m.group(3).strip()
                # バージョン番号を数値タプル化して最新 iOS ランタイムを優先
                verTuple = tuple(int(x) for x in re.findall(r"\d+", osVer))
                candidates.append((verTuple, devName, udid))
            if not candidates:
              return None
            candidates.sort(key=lambda item: (item[0], item[1]), reverse=True)
            return candidates[0][2]


          def buildDestinations(containerArgs, kind, name, supported, sdkroot):
            tokens = set(supported.split()) if supported else set()
            wantsIos = ("iphonesimulator" in tokens) or ("iphoneos" in tokens) or ("iphone" in sdkroot.lower())
            wantsMac = ("macosx" in tokens) or ("macos" in sdkroot.lower()) or ("macosx" in sdkroot.lower())

            dests = []
            if wantsMac:
              dests.append(("macOS", "platform=macOS", True, True))
            if wantsIos:
              udid = findIosSimulatorFromShowDestinations(containerArgs, kind, name)
              if udid:
                dests.append(("iOS Simulator", f"platform=iOS Simulator,id={udid}", True, False))
              else:
                dests.append(("iOS Simulator (generic)", "generic/platform=iOS Simulator", False, False))

            if not dests:
              dests.append(("macOS (fallback)", "platform=macOS", True, True))
            return dests


          def main():
            containerArgs, containerName, projPath = resolveContainer()
            kind, name = pickSchemeOrTarget(containerArgs, containerName, projPath)
            supported, sdkroot = detectBuildSettings(containerArgs, kind, name)
            unitTests, uiTests = inspectPbxproj(projPath)
            dests = buildDestinations(containerArgs, kind, name, supported, sdkroot)

            print(f"Detected: {kind}={name}, SUPPORTED_PLATFORMS='{supported}', SDKROOT='{sdkroot}'")
            print(f"UnitTests={unitTests}, UITests={uiTests}, Destinations={dests}")

            flag = "-scheme" if kind == "scheme" else "-target"
            buildSignFlags = [
              "CODE_SIGNING_ALLOWED=NO",
              "CODE_SIGNING_REQUIRED=NO",
              "CODE_SIGN_IDENTITY=",
            ]
            # macOS の Hardened Runtime 有効アプリでテストバンドル読込が失敗するのを防ぐ
            macTestSignFlags = [
              "CODE_SIGN_IDENTITY=-",
              "ENABLE_HARDENED_RUNTIME=NO",
            ]

            for label, dest, canRunTests, isMac in dests:
              print(f"\n=== Building for {label} ({dest}) ===", flush=True)
              baseBuildCmd = [
                "xcodebuild",
                *containerArgs,
                flag,
                name,
                "-destination",
                dest,
                *buildSignFlags,
              ]

              if kind == "scheme" and unitTests and canRunTests:
                skipFlags = [f"-skip-testing:{t}" for t in uiTests]
                testSignFlags = macTestSignFlags if isMac else buildSignFlags
                testCmd = [
                  "xcodebuild",
                  *containerArgs,
                  flag,
                  name,
                  "-destination",
                  dest,
                  *testSignFlags,
                  *skipFlags,
                  "test",
                ]
                code, tailLog = runStreaming(testCmd)
                if code == 0:
                  continue
                if "not currently configured for the test action" in tailLog:
                  print("::warning::スキームに Test アクションが未設定のため build のみ実行します．", flush=True)
                  runCmd([*baseBuildCmd, "build"], check=True, capture=False)
                else:
                  sys.exit(code)
              else:
                runCmd([*baseBuildCmd, "build"], check=True, capture=False)


          if __name__ == "__main__":
            main()
          PYEOF

  flutter-dart:
    name: Flutter / Dart チェック (${{ needs.repo-checks.outputs.dart_kind }})
    needs: repo-checks
    if: ${{ !cancelled() && needs.repo-checks.outputs.has_dart_flutter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        if: ${{ needs.repo-checks.outputs.dart_kind == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Dart
        if: ${{ needs.repo-checks.outputs.dart_kind == 'dart' }}
        uses: dart-lang/setup-dart@v1

      - name: Get dependencies & analyze
        env:
          DART_KIND: ${{ needs.repo-checks.outputs.dart_kind }}
        run: |
          if [ "$DART_KIND" = "flutter" ]; then
            flutter pub get
            flutter analyze --no-fatal-infos
          else
            dart pub get
            dart analyze --fatal-warnings
          fi

      - name: Run tests
        if: ${{ needs.repo-checks.outputs.has_dart_tests == 'true' }}
        env:
          DART_KIND: ${{ needs.repo-checks.outputs.dart_kind }}
        run: |
          if [ "$DART_KIND" = "flutter" ]; then
            flutter test
          else
            dart test
          fi

  dotnet:
    name: .NET / C# チェック
    needs: repo-checks
    if: ${{ !cancelled() && needs.repo-checks.outputs.has_dotnet == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET (from global.json)
        if: ${{ needs.repo-checks.outputs.dotnet_global_json != '' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ${{ needs.repo-checks.outputs.dotnet_global_json }}

      - name: Set up .NET (from csproj TargetFramework)
        if: ${{ needs.repo-checks.outputs.dotnet_global_json == '' }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            ${{ needs.repo-checks.outputs.dotnet_versions }}

      - name: Restore & build
        env:
          DOTNET_TARGET: ${{ needs.repo-checks.outputs.dotnet_target }}
        run: |
          dotnet restore "$DOTNET_TARGET" -p:EnableWindowsTargeting=true
          dotnet build "$DOTNET_TARGET" --no-restore -p:EnableWindowsTargeting=true

      - name: Run tests
        if: ${{ needs.repo-checks.outputs.has_dotnet_tests == 'true' }}
        env:
          DOTNET_TARGET: ${{ needs.repo-checks.outputs.dotnet_target }}
        run: |
          dotnet test "$DOTNET_TARGET" --no-build --no-restore -p:EnableWindowsTargeting=true
