name: Common CI

on:
  workflow_call:
    inputs:
      enable-no-emoji:
        description: "絵文字禁止チェック (lint-no-emoji) を有効にするか"
        type: boolean
        default: true
      enable-secret-scan:
        description: "シークレット・機密ファイル検出を有効にするか"
        type: boolean
        default: true
      enable-hygiene:
        description: "コンフリクト・巨大ファイルチェックを有効にするか"
        type: boolean
        default: true
      enable-syntax:
        description: "JSON / TOML / YAML / Plist / Shell / Ruby / JS / Dockerfile 構文チェックを有効にするか"
        type: boolean
        default: true
      max-file-size-mb:
        description: "巨大ファイル判定の上限（MB）"
        type: number
        default: 10
      allowed-emoji-prefixes:
        description: "絵文字チェックから除外するパス先頭（カンマ区切り）"
        type: string
        default: ""
      allowed-secret-prefixes:
        description: "シークレット検出から除外するパス先頭（カンマ区切り）"
        type: string
        default: ""
      enable-node:
        description: "Node.js / TypeScript チェックを有効にするか"
        type: boolean
        default: true
      enable-python:
        description: "Python チェックを有効にするか"
        type: boolean
        default: true
      enable-apple:
        description: "iOS / macOS (Swift / Xcode) チェックを有効にするか"
        type: boolean
        default: true
      enable-flutter-dart:
        description: "Flutter / Dart チェックを有効にするか"
        type: boolean
        default: true
      enable-dotnet:
        description: ".NET / C# チェックを有効にするか"
        type: boolean
        default: true
      audit-fail-on-error:
        description: "依存パッケージの脆弱性検出時に CI を失敗させるか"
        type: boolean
        default: false
      always-run-builds:
        description: "変更ファイル判定を無視して検出された全スタックのビルドを常に実行するか"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  repo-checks:
    name: 共通チェック & スタック検出
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_node: ${{ steps.detect.outputs.has_node }}
      node_pm: ${{ steps.detect.outputs.node_pm }}
      node_has_pm_field: ${{ steps.detect.outputs.node_has_pm_field }}
      node_yarn_berry: ${{ steps.detect.outputs.node_yarn_berry }}
      node_has_lockfile: ${{ steps.detect.outputs.node_has_lockfile }}
      node_version_file: ${{ steps.detect.outputs.node_version_file }}
      has_python: ${{ steps.detect.outputs.has_python }}
      python_installer: ${{ steps.detect.outputs.python_installer }}
      python_version: ${{ steps.detect.outputs.python_version }}
      python_version_file: ${{ steps.detect.outputs.python_version_file }}
      has_python_deps: ${{ steps.detect.outputs.has_python_deps }}
      python_has_build_system: ${{ steps.detect.outputs.python_has_build_system }}
      python_has_pyproject_deps: ${{ steps.detect.outputs.python_has_pyproject_deps }}
      python_has_dev_extra: ${{ steps.detect.outputs.python_has_dev_extra }}
      python_has_dev_group: ${{ steps.detect.outputs.python_has_dev_group }}
      has_python_tests: ${{ steps.detect.outputs.has_python_tests }}
      has_apple: ${{ steps.detect.outputs.has_apple }}
      apple_kind: ${{ steps.detect.outputs.apple_kind }}
      apple_workspace: ${{ steps.detect.outputs.apple_workspace }}
      apple_project: ${{ steps.detect.outputs.apple_project }}
      apple_has_podfile: ${{ steps.detect.outputs.apple_has_podfile }}
      apple_has_swiftlint: ${{ steps.detect.outputs.apple_has_swiftlint }}
      has_dart_flutter: ${{ steps.detect.outputs.has_dart_flutter }}
      dart_kind: ${{ steps.detect.outputs.dart_kind }}
      has_dart_tests: ${{ steps.detect.outputs.has_dart_tests }}
      has_dotnet: ${{ steps.detect.outputs.has_dotnet }}
      dotnet_target: ${{ steps.detect.outputs.dotnet_target }}
      dotnet_global_json: ${{ steps.detect.outputs.dotnet_global_json }}
      dotnet_versions: ${{ steps.detect.outputs.dotnet_versions }}
      has_dotnet_tests: ${{ steps.detect.outputs.has_dotnet_tests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect project stack & changed files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ALWAYS_RUN_BUILDS: ${{ inputs.always-run-builds }}
          ENABLE_NODE_INPUT: ${{ inputs.enable-node }}
          ENABLE_PYTHON_INPUT: ${{ inputs.enable-python }}
          ENABLE_APPLE_INPUT: ${{ inputs.enable-apple }}
          ENABLE_DART_INPUT: ${{ inputs.enable-flutter-dart }}
          ENABLE_DOTNET_INPUT: ${{ inputs.enable-dotnet }}
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import re
          import subprocess

          try:
            import tomllib
          except ImportError:
            tomllib = None


          def gitTrackedFiles():
            try:
              res = subprocess.run(["git", "ls-files", "-z"], check=True, capture_output=True)
            except (subprocess.CalledProcessError, FileNotFoundError):
              return []
            return [p for p in os.fsdecode(res.stdout).split("\0") if p]


          def getChangedFiles():
            """変更ファイル一覧を返す．判定不能（初回push・workflow_dispatch等）時は None（全ビルド対象）を返す．"""
            if os.environ.get("ALWAYS_RUN_BUILDS", "false").lower() == "true":
              return None
            eventName = os.environ.get("EVENT_NAME", "")
            if eventName == "workflow_dispatch":
              return None

            baseSha = ""
            if eventName == "pull_request":
              baseSha = os.environ.get("PR_BASE_SHA", "").strip()
            elif eventName == "push":
              baseSha = os.environ.get("BEFORE_SHA", "").strip()

            if not baseSha or re.fullmatch(r"0+", baseSha):
              return None

            # shallow clone (fetch-depth: 1) でも比較できるよう baseSha のみ 1 コミット取得を試みる
            hasBase = subprocess.run(
              ["git", "cat-file", "-e", f"{baseSha}^{{commit}}"],
              capture_output=True,
            ).returncode == 0
            if not hasBase:
              subprocess.run(
                ["git", "fetch", "--no-tags", "--depth=1", "origin", baseSha],
                capture_output=True,
              )
              hasBase = subprocess.run(
                ["git", "cat-file", "-e", f"{baseSha}^{{commit}}"],
                capture_output=True,
              ).returncode == 0

            if not hasBase:
              return None

            diffRange = f"{baseSha}...HEAD" if eventName == "pull_request" else f"{baseSha}..HEAD"
            res = subprocess.run(
              ["git", "diff", "--name-only", "-z", diffRange],
              capture_output=True,
            )
            if res.returncode != 0:
              return None
            return [p for p in os.fsdecode(res.stdout).split("\0") if p]


          def computeStackRunFlags(changedFiles):
            """変更ファイルに応じて実行すべきスタックを絞り込み，無料枠（特に macos-26）を節約する．"""
            if changedFiles is None:
              return {k: True for k in ("node", "python", "apple", "dart", "dotnet")}

            if not changedFiles:
              return {k: False for k in ("node", "python", "apple", "dart", "dotnet")}

            # ワークフローや共通ビルドスクリプト変更時は全スタック検証
            for p in changedFiles:
              base = os.path.basename(p)
              if p.startswith(".github/workflows/") or base in ("Makefile", "GNUmakefile"):
                return {k: True for k in ("node", "python", "apple", "dart", "dotnet")}

            flags = {"node": False, "python": False, "apple": False, "dart": False, "dotnet": False}
            for p in changedFiles:
              lower = p.lower()
              base = os.path.basename(lower)
              _, ext = os.path.splitext(base)

              # Node.js / Web
              if (
                ext in (".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs", ".vue", ".svelte", ".astro", ".css", ".scss", ".sass", ".less", ".html", ".json")
                or base in (".nvmrc", ".node-version", ".yarnrc.yml", ".eslintrc.json", "biome.json", "pnpm-lock.yaml", "yarn.lock", "bun.lock", "bun.lockb")
                or base.startswith(("tsconfig", "jsconfig", "vite.config.", "next.config.", "vitest.config.", "jest.config."))
              ):
                flags["node"] = True

              # Python
              if (
                ext in (".py", ".pyi", ".pyx", ".toml")
                or base in ("requirements.txt", "requirements-dev.txt", "setup.py", "setup.cfg", "uv.lock", "poetry.lock", ".python-version", "ruff.toml", ".ruff.toml", "pytest.ini", "tox.ini")
                or (base.startswith("requirements") and ext == ".txt")
              ):
                flags["python"] = True

              # Apple (Swift / Xcode)
              if (
                ext in (".swift", ".m", ".mm", ".h", ".c", ".cpp", ".metal", ".xib", ".storyboard", ".plist", ".entitlements", ".xcprivacy", ".xcstrings")
                or ".xcodeproj/" in lower
                or ".xcworkspace/" in lower
                or ".xcassets/" in lower
                or base in ("package.swift", "package.resolved", "podfile", "podfile.lock", "project.yml", ".swiftlint.yml", ".swiftlint.yaml")
              ):
                flags["apple"] = True

              # Flutter / Dart
              if (
                ext == ".dart"
                or base in ("pubspec.yaml", "pubspec.lock", "analysis_options.yaml")
                or p.startswith(("lib/", "test/", "android/", "ios/"))
              ):
                flags["dart"] = True

              # .NET / C#
              if (
                ext in (".cs", ".fs", ".vb", ".razor", ".xaml", ".csproj", ".fsproj", ".sln", ".slnx")
                or base in ("directory.build.props", "directory.build.targets", "global.json", "nuget.config")
              ):
                flags["dotnet"] = True

            return flags


          def detectNode():
            hasNode = os.path.isfile("package.json")
            pm = "npm"
            hasPmField = False
            yarnBerry = False
            hasLockfile = False
            versionFile = ""

            if hasNode:
              try:
                with open("package.json", "r", encoding="utf-8-sig") as f:
                  pkg = json.load(f)
                pmSpec = str(pkg.get("packageManager", "")).strip()
                if pmSpec:
                  hasPmField = True
                  if pmSpec.startswith("pnpm@"):
                    pm = "pnpm"
                  elif pmSpec.startswith("yarn@"):
                    pm = "yarn"
                    yarnVer = pmSpec.split("@", 1)[1]
                    if not yarnVer.startswith("1."):
                      yarnBerry = True
                  elif pmSpec.startswith("bun@"):
                    pm = "bun"
                  elif pmSpec.startswith("npm@"):
                    pm = "npm"
              except (OSError, json.JSONDecodeError):
                pass

              if not hasPmField:
                if os.path.isfile("pnpm-lock.yaml"):
                  pm = "pnpm"
                elif os.path.isfile("yarn.lock") or os.path.isfile(".yarnrc.yml"):
                  pm = "yarn"
                elif os.path.isfile("bun.lock") or os.path.isfile("bun.lockb"):
                  pm = "bun"
                else:
                  pm = "npm"

              if pm == "yarn" and not yarnBerry and os.path.isfile(".yarnrc.yml"):
                yarnBerry = True

              lockCandidates = {
                "pnpm": ["pnpm-lock.yaml"],
                "yarn": ["yarn.lock"],
                "bun": ["bun.lock", "bun.lockb"],
                "npm": ["package-lock.json", "npm-shrinkwrap.json"],
              }
              hasLockfile = any(os.path.isfile(p) for p in lockCandidates.get(pm, []))

              for vf in (".nvmrc", ".node-version"):
                if os.path.isfile(vf):
                  versionFile = vf
                  break

            return {
              "has_node": "true" if hasNode else "false",
              "node_pm": pm,
              "node_has_pm_field": "true" if hasPmField else "false",
              "node_yarn_berry": "true" if yarnBerry else "false",
              "node_has_lockfile": "true" if hasLockfile else "false",
              "node_version_file": versionFile,
            }


          def resolvePythonVersion(requiresSpec):
            defaultVer = (3, 12)
            if not requiresSpec:
              return "3.12"
            minRequired = None
            for op, maj, mn in re.findall(r"(>=|==|~=|>)(\d+)\.(\d+)", str(requiresSpec)):
              pair = (int(maj), int(mn))
              if op == ">":
                pair = (pair[0], pair[1] + 1)
              if minRequired is None or pair > minRequired:
                minRequired = pair
            if minRequired and minRequired > defaultVer:
              return f"{minRequired[0]}.{minRequired[1]}"
            return "3.12"


          def detectPython(trackedFiles):
            depFiles = ("pyproject.toml", "requirements.txt", "requirements-dev.txt", "setup.py", "uv.lock")
            hasPyDeps = any(os.path.isfile(f) for f in depFiles)
            pyFiles = [p for p in trackedFiles if p.endswith(".py") and os.path.isfile(p)]
            hasPython = hasPyDeps or len(pyFiles) > 0

            installer = "uv" if os.path.isfile("uv.lock") else "pip"
            versionFile = ".python-version" if os.path.isfile(".python-version") else ""
            pythonVersion = "3.12"

            hasBuildSystem = os.path.isfile("setup.py")
            hasPyprojectDeps = False
            hasDevExtra = False
            hasDevGroup = False

            if os.path.isfile("pyproject.toml") and tomllib is not None:
              try:
                with open("pyproject.toml", "rb") as f:
                  data = tomllib.load(f)
                project = data.get("project") if isinstance(data.get("project"), dict) else {}
                if "build-system" in data:
                  hasBuildSystem = True
                if isinstance(project.get("dependencies"), list) and len(project["dependencies"]) > 0:
                  hasPyprojectDeps = True
                optDeps = project.get("optional-dependencies")
                if isinstance(optDeps, dict) and "dev" in optDeps:
                  hasDevExtra = True
                depGroups = data.get("dependency-groups")
                if isinstance(depGroups, dict) and "dev" in depGroups:
                  hasDevGroup = True
                if not versionFile and project.get("requires-python"):
                  pythonVersion = resolvePythonVersion(project.get("requires-python"))
              except (OSError, tomllib.TOMLDecodeError):
                pass

            hasTests = False
            for p in pyFiles:
              parts = p.split("/")
              base = os.path.basename(p)
              if "tests" in parts or base.startswith("test_") or base.endswith("_test.py"):
                hasTests = True
                break

            return {
              "has_python": "true" if hasPython else "false",
              "python_installer": installer,
              "python_version": "" if versionFile else pythonVersion,
              "python_version_file": versionFile,
              "has_python_deps": "true" if hasPyDeps else "false",
              "python_has_build_system": "true" if hasBuildSystem else "false",
              "python_has_pyproject_deps": "true" if hasPyprojectDeps else "false",
              "python_has_dev_extra": "true" if hasDevExtra else "false",
              "python_has_dev_group": "true" if hasDevGroup else "false",
              "has_python_tests": "true" if hasTests else "false",
            }


          def isXcodeGenSpec(path):
            if not os.path.isfile(path):
              return False
            try:
              text = open(path, "r", encoding="utf-8", errors="replace").read()
            except OSError:
              return False
            return bool(re.search(r"^\s*targets\s*:", text, re.M))


          def detectApple():
            entries = sorted(os.listdir("."))
            workspaces = [e for e in entries if e.endswith(".xcworkspace") and os.path.isdir(e)]
            projects = [e for e in entries if e.endswith(".xcodeproj") and os.path.isdir(e)]
            hasPodfile = os.path.isfile("Podfile")
            hasXcodegen = isXcodeGenSpec("project.yml")
            hasSpm = os.path.isfile("Package.swift")
            hasSwiftLint = os.path.isfile(".swiftlint.yml") or os.path.isfile(".swiftlint.yaml")

            appleKind = ""
            appleWorkspace = workspaces[0] if workspaces else ""
            appleProject = projects[0] if projects else ""

            if appleWorkspace:
              appleKind = "xcworkspace"
            elif appleProject:
              appleKind = "xcodeproj"
            elif hasXcodegen:
              appleKind = "xcodegen"
            elif hasSpm:
              appleKind = "spm"

            return {
              "has_apple": "true" if appleKind else "false",
              "apple_kind": appleKind,
              "apple_workspace": appleWorkspace,
              "apple_project": appleProject,
              "apple_has_podfile": "true" if hasPodfile else "false",
              "apple_has_swiftlint": "true" if hasSwiftLint else "false",
            }


          def detectDartFlutter(trackedFiles):
            if not os.path.isfile("pubspec.yaml"):
              return {
                "has_dart_flutter": "false",
                "dart_kind": "",
                "has_dart_tests": "false",
              }
            kind = "dart"
            try:
              text = open("pubspec.yaml", "r", encoding="utf-8", errors="replace").read()
              if re.search(r"^\s*sdk\s*:\s*flutter\b", text, re.M):
                kind = "flutter"
            except OSError:
              pass
            hasTests = any(
              p.startswith("test/") and p.endswith("_test.dart") and os.path.isfile(p)
              for p in trackedFiles
            )
            return {
              "has_dart_flutter": "true",
              "dart_kind": kind,
              "has_dart_tests": "true" if hasTests else "false",
            }


          def detectDotnet(trackedFiles):
            empty = {
              "has_dotnet": "false",
              "dotnet_target": "",
              "dotnet_global_json": "",
              "dotnet_versions": "",
              "has_dotnet_tests": "false",
            }
            if os.path.isdir("ProjectSettings"):
              return empty

            entries = sorted(os.listdir("."))
            slns = [e for e in entries if os.path.isfile(e) and e.endswith((".sln", ".slnx"))]
            rootProjs = [e for e in entries if os.path.isfile(e) and e.endswith((".csproj", ".fsproj"))]
            if not slns and not rootProjs:
              return empty

            targetFile = slns[0] if slns else rootProjs[0]
            globalJson = "global.json" if os.path.isfile("global.json") else ""

            sdkMajors = set()
            if targetFile.endswith(".slnx"):
              sdkMajors.add(9)

            hasTests = False
            hasMobileOnlyWorkload = False
            projFiles = [p for p in trackedFiles if p.endswith((".csproj", ".fsproj")) and os.path.isfile(p)]
            if not projFiles:
              projFiles = rootProjs
            inspectFiles = list(projFiles)
            if os.path.isfile("Directory.Build.props"):
              inspectFiles.append("Directory.Build.props")

            for fp in inspectFiles:
              try:
                content = open(fp, "r", encoding="utf-8", errors="replace").read()
              except OSError:
                continue
              for m in re.finditer(r"\bnet(\d+)\.0\b", content):
                major = int(m.group(1))
                if major >= 6:
                  sdkMajors.add(major)
              if re.search(r"\bnet\d+\.0-(?:ios|android|maccatalyst|tizen)\b", content):
                hasMobileOnlyWorkload = True
              if "Microsoft.NET.Test.Sdk" in content or "<IsTestProject>true</IsTestProject>" in content:
                hasTests = True

            if hasMobileOnlyWorkload:
              return empty

            versionsStr = "\n".join(f"{m}.0.x" for m in sorted(sdkMajors)) if sdkMajors else "9.0.x"
            return {
              "has_dotnet": "true",
              "dotnet_target": targetFile,
              "dotnet_global_json": globalJson,
              "dotnet_versions": versionsStr,
              "has_dotnet_tests": "true" if hasTests else "false",
            }


          def isEnabledInput(envName):
            return os.environ.get(envName, "true").strip().lower() == "true"


          def main():
            tracked = gitTrackedFiles()
            changed = getChangedFiles()
            runFlags = computeStackRunFlags(changed)
            print(f"changed_files={len(changed) if changed is not None else 'ALL'}, runFlags={runFlags}")

            outputs = {}
            outputs.update(detectNode())
            outputs.update(detectPython(tracked))
            outputs.update(detectApple())
            outputs.update(detectDartFlutter(tracked))
            outputs.update(detectDotnet(tracked))

            # workflow_call inputs と変更ファイル判定で実際に起動するジョブを最終決定
            if not isEnabledInput("ENABLE_NODE_INPUT") or not runFlags["node"]:
              outputs["has_node"] = "false"
            if not isEnabledInput("ENABLE_PYTHON_INPUT") or not runFlags["python"]:
              outputs["has_python"] = "false"
            if not isEnabledInput("ENABLE_APPLE_INPUT") or not runFlags["apple"]:
              outputs["has_apple"] = "false"
            if not isEnabledInput("ENABLE_DART_INPUT") or not runFlags["dart"]:
              outputs["has_dart_flutter"] = "false"
            if not isEnabledInput("ENABLE_DOTNET_INPUT") or not runFlags["dotnet"]:
              outputs["has_dotnet"] = "false"

            outputPath = os.environ.get("GITHUB_OUTPUT")
            if outputPath:
              with open(outputPath, "a", encoding="utf-8") as f:
                for k, v in outputs.items():
                  if "\n" in v:
                    f.write(f"{k}<<GH_OUTPUT_EOF\n{v}\nGH_OUTPUT_EOF\n")
                  else:
                    f.write(f"{k}={v}\n")

            for k, v in outputs.items():
              print(f"detect: {k}={v!r}")


          if __name__ == "__main__":
            main()
          PYEOF

      - name: Run repository quality & security checks
        env:
          CI_ENABLE_NO_EMOJI: ${{ inputs.enable-no-emoji }}
          CI_ENABLE_SECRET_SCAN: ${{ inputs.enable-secret-scan }}
          CI_ENABLE_HYGIENE: ${{ inputs.enable-hygiene }}
          CI_ENABLE_SYNTAX: ${{ inputs.enable-syntax }}
          CI_MAX_FILE_SIZE_MB: ${{ inputs.max-file-size-mb }}
          CI_ALLOWED_EMOJI_PREFIXES: ${{ inputs.allowed-emoji-prefixes }}
          CI_ALLOWED_SECRET_PREFIXES: ${{ inputs.allowed-secret-prefixes }}
        run: |
          python3 - --tracked --ci << 'REPO_CHECK_PYEOF'
          #!/usr/bin/env python3
          """Universal repository quality, secret, hygiene, and syntax checker.

          Used identically by:
            - Local CLI (`ci-check`)
            - Global git pre-commit hook (`pre-commit-ci-check --staged`)
            - GitHub Actions Reusable Workflow (`.github/workflows/common-ci.yml --ci`)
          """
          import argparse
          import json
          import os
          import plistlib
          import re
          import shutil
          import subprocess
          import sys
          import tempfile

          try:
            import tomllib
          except ImportError:
            tomllib = None

          try:
            import yaml
          except ImportError:
            yaml = None


          def parseBoolEnv(name, default):
            val = os.environ.get(name)
            if val is None or val == "":
              return default
            return val.strip().lower() in ("1", "true", "yes", "on")


          def parseCsvEnv(name):
            val = os.environ.get(name, "").strip()
            if not val:
              return []
            return [item.strip() for item in val.split(",") if item.strip()]


          # =====================================================================
          # 設定（環境変数または workflow_call inputs から上書き可能）
          # =====================================================================
          ENABLE_NO_EMOJI = parseBoolEnv("CI_ENABLE_NO_EMOJI", True)
          ENABLE_SECRET_SCAN = parseBoolEnv("CI_ENABLE_SECRET_SCAN", True)
          ENABLE_HYGIENE = parseBoolEnv("CI_ENABLE_HYGIENE", True)
          ENABLE_SYNTAX = parseBoolEnv("CI_ENABLE_SYNTAX", True)

          # 巨大ファイルの上限（MB）
          MAX_FILE_SIZE_MB = float(os.environ.get("CI_MAX_FILE_SIZE_MB") or 10)

          # 行末等にこのマーカーを含む行は，絵文字・シークレット・コンフリクト検査をスキップ
          IGNORE_MARKER = "ci-" + "ignore"

          # ロックファイル（機械生成のため絵文字・シークレット検査から除外）
          EXCLUDED_LOCKFILES = {
            "package-lock.json",
            "yarn.lock",
            "pnpm-lock.yaml",
            "uv.lock",
            "poetry.lock",
            "Cargo.lock",
