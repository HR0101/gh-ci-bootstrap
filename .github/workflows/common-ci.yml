          EMOJI_PATTERN = re.compile("[" + "".join(f"{chr(s)}-{chr(e)}" for s, e in EMOJI_RANGES) + "]")

          SENSITIVE_EXACT_NAMES = {
            "id_rsa",
            "id_dsa",
            "id_ecdsa",
